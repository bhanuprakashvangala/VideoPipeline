
version: '3.8'

services:
  # Detection service - YOLOv8n variant
  detection-yolov8n:
    build:
      context: .
      dockerfile: Dockerfile.detection
    environment:
      - MODEL_VARIANT=yolov8n
    ports:
      - "50051-50054:50051"  # Support 4 replicas
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - pipeline-network

  # Detection service - YOLOv8s variant
  detection-yolov8s:
    build:
      context: .
      dockerfile: Dockerfile.detection
    environment:
      - MODEL_VARIANT=yolov8s
    ports:
      - "50061-50064:50051"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - pipeline-network

  # Tracking service
  tracking:
    build:
      context: .
      dockerfile: Dockerfile.tracking
    ports:
      - "50052:50052"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - pipeline-network
    depends_on:
      - detection-yolov8n
      - detection-yolov8s

  # Load balancer (nginx)
  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pipeline-network
    depends_on:
      - detection-yolov8n
      - detection-yolov8s

  # MinIO for model registry
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - pipeline-network

networks:
  pipeline-network:
    driver: bridge

volumes:
  minio-data:
